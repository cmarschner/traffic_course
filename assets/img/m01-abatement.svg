<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-size="10.5" role="img" aria-label="Illustrative abatement cost curve for transport">
