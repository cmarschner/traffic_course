<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif" font-size="13" role="img" aria-labelledby="bt bd">
<title id="bt">Braess's paradox</title>
<desc id="bd">Left: 4,000 drivers split evenly between two routes, each taking 65 minutes. Right: a new zero-travel-time shortcut is added between the two midpoints; every driver uses it and everyone now takes 80 minutes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a5560"/></marker></defs>
<rect width="760" height="300" rx="10" fill="#fff"/>
<g id="net">
</g>
<!-- BEFORE -->
<text x="185" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="#1d232a">Before: two routes</text>
<g stroke="#4a5560" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<path d="M52,150 L172,68"/><path d="M198,68 L318,148"/><path d="M52,152 L172,232"/><path d="M198,232 L318,154"/>
</g>
<g fill="#1f8a92"><circle cx="40" cy="150" r="13"/><circle cx="330" cy="150" r="13"/></g>
<g fill="#fff" stroke="#4a5560" stroke-width="2"><circle cx="185" cy="60" r="11"/><circle cx="185" cy="240" r="11"/></g>
<g font-weight="700" fill="#fff" text-anchor="middle"><text x="40" y="155">S</text><text x="330" y="155">E</text></g>
<g text-anchor="middle" fill="#1d232a" font-weight="600"><text x="185" y="64" font-size="11">A</text><text x="185" y="244" font-size="11">B</text></g>
<g fill="#c45a2c" font-weight="600"><text x="78" y="95">T/100 min</text><text x="262" y="95">45 min</text><text x="78" y="215">45 min</text><text x="262" y="215">T/100 min</text></g>
<text x="185" y="280" text-anchor="middle" fill="#4a5560">2,000 via A, 2,000 via B → <tspan font-weight="700" fill="#1d232a">65 min each</tspan></text>
<!-- AFTER -->
<line x1="380" y1="40" x2="380" y2="270" stroke="#e3e0d8" stroke-width="2"/>
<text x="575" y="26" text-anchor="middle" font-weight="700" font-size="14" fill="#1d232a">After: a free shortcut A→B</text>
<g stroke="#4a5560" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<path d="M442,150 L562,68"/><path d="M588,68 L708,148" stroke="#c9c5bc"/><path d="M442,152 L562,232" stroke="#c9c5bc"/><path d="M588,232 L708,154"/>
<path d="M575,72 L575,226" stroke="#1f8a92" stroke-width="3.5"/>
</g>
<g fill="#1f8a92"><circle cx="430" cy="150" r="13"/><circle cx="720" cy="150" r="13"/></g>
<g fill="#fff" stroke="#4a5560" stroke-width="2"><circle cx="575" cy="60" r="11"/><circle cx="575" cy="240" r="11"/></g>
<g font-weight="700" fill="#fff" text-anchor="middle"><text x="430" y="155">S</text><text x="720" y="155">E</text></g>
<g text-anchor="middle" fill="#1d232a" font-weight="600"><text x="575" y="64" font-size="11">A</text><text x="575" y="244" font-size="11">B</text></g>
<g fill="#c45a2c" font-weight="600"><text x="458" y="95">T/100</text><text x="652" y="95" fill="#9aa3ab">45</text><text x="458" y="215" fill="#9aa3ab">45</text><text x="652" y="215">T/100</text></g>
<text x="583" y="153" fill="#1f8a92" font-weight="700">0 min</text>
<text x="575" y="280" text-anchor="middle" fill="#4a5560">all 4,000 take S→A→B→E → <tspan font-weight="700" fill="#c45a2c">80 min each</tspan></text>
</svg>
