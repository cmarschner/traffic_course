<title id="t">Welfare-centered transport planning</title>
<desc id="d">People at the center. Five objectives flow toward them: access and choice, health, externalities, land, and public cost. Around them, on the curve of the Earth's horizon, run the limits: no deaths on the road, the carbon budget, land, and minimum access for all.</desc>
